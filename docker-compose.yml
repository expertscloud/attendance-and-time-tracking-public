# Local development stack.
# 1) cp .env.example .env  and fill AWS S3 values
# 2) docker compose up --build

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: tickly_root
      MYSQL_DATABASE: tickly
      MYSQL_USER: tickly
      MYSQL_PASSWORD: tickly
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '8025:8025'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_KEY: tickly-local-docker-dev-key-change-me
      HOST: 0.0.0.0
      PORT: 3333
      NODE_ENV: production
      LOG_LEVEL: info
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: tickly
      DB_PASSWORD: tickly
      DB_DATABASE: tickly
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME: tickly
      SMTP_PASSWORD: tickly
      SMTP_FROM: noreply@example.com
      FRONTEND_BASE_URL: http://localhost:3000
      ## AWS S3 (from root .env — same pattern as production)
      DRIVE_DISK: ${DRIVE_DISK:-s3}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
      AWS_S3_SIGNED_URL_EXPIRY_DAYS: ${AWS_S3_SIGNED_URL_EXPIRY_DAYS:-4 days}
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - '3333:3333'

  admin:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - '3000:80'

volumes:
  mysql_data:
