name: Test Build on Pull Request

on:
  pull_request:
    branches:
      - '**'
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # version nodejs 22
          cache: 'npm' # Enable caching for npm

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Report build status
        if: failure()
        run: echo "The build failed. Please fix the errors before merging."
