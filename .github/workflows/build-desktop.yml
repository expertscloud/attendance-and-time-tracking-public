name: Build desktop app

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'API URL baked into the desktop app (VITE_BACKEND_URL)'
        required: true
        default: 'http://localhost:3333'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_cmd: npm run build:dir
            artifact_glob: release/*.{AppImage,deb,zip}
          - os: windows-latest
            build_cmd: npm run build:dir
            artifact_glob: release/*.{exe,zip}
          - os: macos-latest
            build_cmd: npm run build:dir
            artifact_glob: release/*.{dmg,zip}

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure environment
        run: |
          cat > .env <<EOF
          VITE_FRONTEND_URL=http://localhost:3000
          VITE_BACKEND_URL=${{ github.event.inputs.backend_url || 'http://localhost:3333' }}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build desktop app
        run: ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tickly-${{ matrix.os }}
          path: frontend/release/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
